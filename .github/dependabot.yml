version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pub
    directories:
      - /
      - /example
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Pinned so CI regenerates identical Pigeon output; upgraded manually.
      - dependency-name: pigeon
      # Major releases need a manual compatibility pass.
      - dependency-name: firebase_*
        update-types: ["version-update:semver-major"]
      - dependency-name: flutter_local_notifications
        update-types: ["version-update:semver-major"]
    groups:
      pub-minor-patch:
        update-types:
          - minor
          - patch
