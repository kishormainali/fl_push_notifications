name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Analyze, format, unit tests, Pigeon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Analyze (plugin)
        run: flutter analyze
      - name: Analyze (example)
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
      - name: Format (generated *.g.dart files are excluded)
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart' | grep -v '\.g\.dart$')
      - name: Unit tests
        run: flutter test
      - name: Pigeon output is committed and up to date
        run: |
          dart run pigeon --input pigeons/messages.dart
          # The committed *.g.dart is dart-formatted; pigeon emits it unformatted.
          dart format lib/src/messages.g.dart
          git diff --exit-code
      - name: Publish dry run
        run: flutter pub publish --dry-run

  android:
    name: Android example build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - run: flutter pub get
      - name: flutter build apk --debug
        working-directory: example
        run: flutter build apk --debug
      - name: Kotlin unit tests (uses the Gradle wrapper generated by the build above)
        working-directory: example/android
        run: ./gradlew :fl_push_notifications:testDebugUnitTest

  ios:
    name: iOS core tests and example build (SwiftPM)
    runs-on: macos-latest
    steps:
      # The checkout folder must be named fl_push_notifications: SwiftPM derives the
      # package identity from the directory name.
      - uses: actions/checkout@v4
        with:
          path: fl_push_notifications
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager
      - run: flutter pub get
        working-directory: fl_push_notifications
      - name: Swift core unit tests
        working-directory: fl_push_notifications/ios/fl_push_notifications
        run: PUSH_NOTIFICATIONS_CORE_ONLY=1 swift test
      - name: flutter build ios --no-codesign --debug
        working-directory: fl_push_notifications/example
        run: flutter build ios --no-codesign --debug
