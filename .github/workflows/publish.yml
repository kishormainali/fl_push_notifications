name: Publish to pub.dev

# Tag format: v<version>, e.g. v0.1.1 (pre-releases: v0.2.0-beta.1)
# One-time setup on pub.dev (package admin > Automated publishing > GitHub Actions):
#   repository: kishormainali/fl_push_notifications
#   tag pattern: v{{version}}
#   environment: pub.dev
# Then publish by bumping pubspec.yaml + CHANGELOG.md and pushing a matching tag.
# Re-pushing a tag for a version that is already on pub.dev skips the test and
# publish jobs and only creates (or updates) the GitHub release.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  # ── 1. Check the tag against the pubspec version ────────────────────────────
  validate-version:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      already_published: ${{ steps.pubdev.outputs.already_published }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches pubspec version
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          PUBSPEC_VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          echo "tag: $VERSION  pubspec: $PUBSPEC_VERSION"
          if [ "$VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "Tag version ($VERSION) does not match pubspec.yaml ($PUBSPEC_VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check CHANGELOG.md has an entry for this version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: tool/check_changelog.sh "$VERSION"

      # Only an HTTP 200 counts as "already published". Any other result
      # (404, network error, timeout) is treated as not published, so the
      # publish job runs and pub.dev itself rejects a real duplicate.
      - name: Check whether this version is already on pub.dev
        id: pubdev
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          status="$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 \
            "https://pub.dev/api/packages/fl_push_notifications/versions/${VERSION}" || true)"
          echo "pub.dev returned HTTP ${status:-none} for fl_push_notifications $VERSION"
          if [ "$status" = "200" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION is already on pub.dev; skipping tests and publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. Verify tests pass before publishing ──────────────────────────────────
  test:
    name: Verify tests
    runs-on: ubuntu-latest
    needs: validate-version
    if: needs.validate-version.outputs.already_published != 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Format (generated *.g.dart files are excluded)
        run: git ls-files '*.dart' | grep -v '\.g\.dart$' | xargs dart format --output=none --set-exit-if-changed

      - name: Run tests
        run: flutter test

  # ── 3. Publish using OIDC (no stored credentials) ───────────────────────────
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    needs: [validate-version, test]
    if: needs.validate-version.outputs.already_published != 'true'

    # Must match the environment configured under:
    #   pub.dev package admin > Automated publishing > GitHub Actions
    environment: pub.dev

    permissions:
      id-token: write   # Required for OIDC token exchange with pub.dev
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Provisions the OIDC token pub.dev needs (exported as PUB_TOKEN). Must run
      # BEFORE the Flutter step: the Flutter SDK's `dart` shadows this one (needed
      # to publish Flutter packages) but reuses the token.
      - name: Set up Dart and pub.dev OIDC token
        uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - run: flutter pub get

      - name: Publish - dry run
        run: dart pub publish --dry-run

      - name: Publish
        run: dart pub publish --force

  # ── 4. Create a GitHub Release for the tag ──────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-version, test, publish]
    # test and publish are skipped when the version is already on pub.dev; the
    # release must still be created then. A skipped needed job would skip this
    # job too, so a status function is required. `!failure()` is false when any
    # needed job failed and `!cancelled()` when the run was cancelled, so a
    # failed or cancelled publish never produces a release. The explicit result
    # checks make the accepted states obvious: success, or skipped for the two
    # jobs that are skipped on a re-pushed tag.
    if: >-
      ${{ !cancelled() && !failure()
      && needs.validate-version.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.test.result)
      && contains(fromJSON('["success","skipped"]'), needs.publish.result) }}

    permissions:
      contents: write   # Required to create a release via GITHUB_TOKEN

    steps:
      - uses: actions/checkout@v4

      # Pulls this version's section out of CHANGELOG.md.
      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            /^## / {
              if (found) exit
              if ($0 == "## " ver || $0 == "## [" ver "]") { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md | sed '/^---$/d' > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "_No CHANGELOG.md entry found for $VERSION._" > release_notes.md
          fi
          cat release_notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          # Anything with a `-` after the version (e.g. -beta.1) is a pre-release.
          prerelease: ${{ contains(needs.validate-version.outputs.version, '-') }}
