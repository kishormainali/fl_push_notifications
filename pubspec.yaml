name: push_notifications
description: "Unified push notifications for Flutter on Android and iOS: FCM and local notifications, tap routing, channels, badges and image notifications."
version: 0.1.0

topics:
  - push-notifications
  - firebase-messaging
  - fcm
  - notifications
  - local-notifications

environment:
  sdk: ^3.13.7
  flutter: '>=3.47.0'

dependencies:
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  pigeon: ^29.1.0

flutter:
  # Native code lives in android/ and ios/push_notifications/.
  plugin:
    platforms:
      android:
        package: com.kishormainali.push_notifications
        pluginClass: PushNotificationsPlugin
      ios:
        pluginClass: PushNotificationsPlugin
